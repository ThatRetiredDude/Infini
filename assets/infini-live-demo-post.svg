<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Infini Live Demo</title>
  <desc id="desc">Standalone promotional graphic for sharing the Infini read-only live demo.</desc>
  <defs>
    <radialGradient id="bg" cx="62%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#155e75" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#064e3b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0v34" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#020617"/>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.45"/>

  <circle cx="1030" cy="92" r="220" fill="#38bdf8" opacity="0.13"/>
  <circle cx="928" cy="588" r="250" fill="#34d399" opacity="0.13"/>
  <circle cx="92" cy="530" r="220" fill="#7c3aed" opacity="0.14"/>

  <g transform="translate(70 58)">
    <rect width="1060" height="514" rx="36" fill="#020617" opacity="0.74" stroke="#334155"/>
    <rect x="1" y="1" width="1058" height="512" rx="35" fill="none" stroke="url(#accent)" opacity="0.7"/>

    <g transform="translate(44 38)">
      <rect width="56" height="56" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <path d="M21 39V17l18 11v11M21 39h16" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="25" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="23" font-weight="800">Infini</text>
      <text x="76" y="49" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">turn a VPS into an active security trap</text>

      <g transform="translate(760 7)">
        <rect width="220" height="42" rx="21" fill="#052e2b" stroke="#34d399"/>
        <circle cx="25" cy="21" r="6" fill="#34d399" filter="url(#glow)"/>
        <text x="44" y="27" fill="#bbf7d0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="800">LIVE DEMO ONLINE</text>
      </g>
    </g>

    <g transform="translate(54 136)">
      <text fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="76" font-weight="900" letter-spacing="-2">Explore the</text>
      <text y="86" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="76" font-weight="900" letter-spacing="-2">Security Hub</text>
      <text y="138" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="23">Free read-only guest demo. No exports. No edits. Just telemetry.</text>

      <g transform="translate(0 180)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" fill="#e0f2fe">
        <g>
          <circle cx="11" cy="11" r="11" fill="#0f766e"/>
          <path d="M6 11l4 4 7-8" fill="none" stroke="#ecfeff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="34" y="17">honeypot hits</text>
        </g>
        <g transform="translate(220 0)">
          <circle cx="11" cy="11" r="11" fill="#0f766e"/>
          <path d="M6 11l4 4 7-8" fill="none" stroke="#ecfeff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="34" y="17">data-room activity</text>
        </g>
        <g transform="translate(0 42)">
          <circle cx="11" cy="11" r="11" fill="#0f766e"/>
          <path d="M6 11l4 4 7-8" fill="none" stroke="#ecfeff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="34" y="17">AI abuse flags</text>
        </g>
        <g transform="translate(220 42)">
          <circle cx="11" cy="11" r="11" fill="#0f766e"/>
          <path d="M6 11l4 4 7-8" fill="none" stroke="#ecfeff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="34" y="17">network sensor events</text>
        </g>
      </g>

      <g transform="translate(0 300)">
        <rect width="332" height="58" rx="18" fill="url(#accent)"/>
        <text x="28" y="37" fill="#020617" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="23" font-weight="900">infini.win</text>
        <text x="158" y="37" fill="#042f2e" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="800">try the demo</text>
      </g>
    </g>

    <g transform="translate(710 158)">
      <rect width="314" height="272" rx="24" fill="#020617" stroke="#334155"/>
      <rect x="18" y="18" width="278" height="34" rx="10" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="38" cy="35" r="5" fill="#ef4444"/>
      <circle cx="56" cy="35" r="5" fill="#f59e0b"/>
      <circle cx="74" cy="35" r="5" fill="#22c55e"/>
      <text x="98" y="40" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">live telemetry</text>

      <g transform="translate(24 76)">
        <rect width="124" height="76" rx="16" fill="#0f172a" stroke="#334155"/>
        <text x="17" y="28" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui" font-size="12">Signals</text>
        <text x="17" y="58" fill="#38bdf8" font-family="Inter, ui-sans-serif, system-ui" font-size="30" font-weight="900">1,354</text>
      </g>
      <g transform="translate(166 76)">
        <rect width="124" height="76" rx="16" fill="#0f172a" stroke="#334155"/>
        <text x="17" y="28" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui" font-size="12">AI Flags</text>
        <text x="17" y="58" fill="#34d399" font-family="Inter, ui-sans-serif, system-ui" font-size="30" font-weight="900">42</text>
      </g>

      <g transform="translate(26 178)">
        <path d="M0 52 C24 16, 48 34, 72 18 S118 4, 146 36 S196 62, 258 12" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
        <path d="M0 72 C35 60, 48 24, 80 36 S126 80, 162 42 S216 28, 258 56" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity="0.86"/>
        <line x1="0" y1="92" x2="260" y2="92" stroke="#1e293b"/>
        <text x="0" y="121" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">guest: read-only</text>
      </g>
    </g>
  </g>
</svg>
