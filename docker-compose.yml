services:
  infini:
    build: .
    container_name: infini
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_FILE=/data/infini.sqlite
      - UPLOADS_DIR=/data/uploads
      - ACCESS_LOG_CSV_DIR=/data/logs
    volumes:
      - infini-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  infini-data:
    driver: local
